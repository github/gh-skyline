---
name: Lint Code Base

permissions:
  contents: read
  packages: read
  # To report GitHub Actions status checks
  statuses: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_GO: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON: false
          VALIDATE_JSON_PRETTIER: false
          LINTER_RULES_PATH: .github/linters
          GOLANGCI_LINT_CONFIG: .golangci.yml
          VALIDATE_YAML_PRETTIER: false
          # Allow Go toolchain auto-download so golangci-lint can satisfy the
          # go.mod toolchain requirement (super-linter sets GOTOOLCHAIN=local
          # internally, which we override here).
          GOTOOLCHAIN: auto
