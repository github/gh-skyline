---
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          release_android: true
          # For more information see: https://developer.android.com/tools/releases/platforms
          # At the time of writing, 35 had just come out of beta and 34 seems to be the most stable.
          android_sdk_version: 34
          generate_attestations: true
          go_version_file: go.mod
